# Продакшен: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
x-app: &app
  image: dogovorilis-backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  bot:
    <<: *app
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "dogovorilis.bot.app"]

  worker:
    <<: *app
    command: ["python", "-m", "dogovorilis.worker.app"]
    depends_on: { bot: { condition: service_started } }

  api:
    <<: *app
    command: ["python", "-m", "uvicorn", "dogovorilis.api.app:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on: { bot: { condition: service_started } }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
